# Argo CD deploys deploy/ on every push to main. Apply via Radar's MCP server.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-accessibility-ninja
spec:
  project: team-accessibility-ninja
  source:
    repoURL: https://github.com/sandeepkanabar/accessibility-ninja.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-accessibility-ninja
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
